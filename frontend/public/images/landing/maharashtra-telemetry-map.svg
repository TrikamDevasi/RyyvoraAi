<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" fill="none" width="100%" height="100%">
  <defs>
    <!-- Radial Telemetry Glow -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <!-- Corridor Line Gradients -->
    <linearGradient id="corridorGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="corridorGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Boundary Fill Gradient -->
    <linearGradient id="stateFill" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#0B132B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Telemetry Pulse Animation Simulation Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Telemetry Coordinate Grid -->
  <g opacity="0.12" stroke="#64748B" stroke-width="0.75" stroke-dasharray="3 6">
    <line x1="80" y1="60" x2="820" y2="60" />
    <line x1="80" y1="180" x2="820" y2="180" />
    <line x1="80" y1="300" x2="820" y2="300" />
    <line x1="80" y1="420" x2="820" y2="420" />
    <line x1="80" y1="540" x2="820" y2="540" />
    
    <line x1="140" y1="30" x2="140" y2="580" />
    <line x1="300" y1="30" x2="300" y2="580" />
    <line x1="460" y1="30" x2="460" y2="580" />
    <line x1="620" y1="30" x2="620" y2="580" />
    <line x1="780" y1="30" x2="780" y2="580" />
  </g>

  <!-- Telemetry Coordinates Watermark -->
  <g fill="#64748B" opacity="0.4" font-family="monospace" font-size="9">
    <text x="90" y="52">19.7515° N, 75.7139° E · MAHARASHTRA WORKFORCE TELEMETRY GRID</text>
    <text x="90" y="565">SYSTEM NSQF-26135 · 36 DISTRICT NODES SYNCHRONIZED · SHA-256</text>
  </g>

  <!-- Stylized Maharashtra State Boundary Contour -->
  <path d="M 175 145 
           C 220 120, 310 110, 380 95
           C 440 85, 520 70, 580 80
           C 640 90, 710 115, 785 140
           C 820 155, 845 190, 830 230
           C 815 270, 760 310, 725 345
           C 690 380, 650 410, 610 445
           C 570 480, 510 510, 460 525
           C 410 540, 350 550, 310 535
           C 270 520, 240 485, 230 450
           C 220 415, 205 375, 185 330
           C 165 285, 140 240, 150 195
           Z"
        fill="url(#stateFill)"
        stroke="#F59E0B"
        stroke-opacity="0.35"
        stroke-width="1.8"
        stroke-dasharray="8 4" />

  <!-- Inner Regional Contour Sub-divisions -->
  <path d="M 380 95 C 370 210, 350 330, 310 535" stroke="#334155" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 4"/>
  <path d="M 580 80 C 570 200, 540 340, 460 525" stroke="#334155" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 4"/>
  <path d="M 185 330 C 320 310, 480 290, 725 345" stroke="#334155" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- High-Capacity Skill & Employment Corridors -->
  <!-- Mumbai to Pune Corridor -->
  <line x1="205" y1="285" x2="280" y2="340" stroke="url(#corridorGrad1)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Pune to Nashik Corridor -->
  <line x1="280" y1="340" x2="265" y2="205" stroke="url(#corridorGrad1)" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 2" />
  <!-- Mumbai to Nashik Corridor -->
  <line x1="205" y1="285" x2="265" y2="205" stroke="#06B6D4" stroke-opacity="0.5" stroke-width="1.5" />
  <!-- Pune to Chhatrapati Sambhajinagar (Aurangabad) -->
  <line x1="280" y1="340" x2="415" y2="245" stroke="url(#corridorGrad2)" stroke-width="2" />
  <!-- Chhatrapati Sambhajinagar to Nagpur Corridor -->
  <line x1="415" y1="245" x2="690" y2="175" stroke="url(#corridorGrad1)" stroke-width="2.2" />
  <!-- Pune to Kolhapur Corridor -->
  <line x1="280" y1="340" x2="270" y2="465" stroke="url(#corridorGrad2)" stroke-width="1.8" />
  <!-- Pune to Solapur Corridor -->
  <line x1="280" y1="340" x2="395" y2="400" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="3 3" />
  <!-- Nagpur to Amravati Corridor -->
  <line x1="690" y1="175" x2="575" y2="185" stroke="#06B6D4" stroke-opacity="0.6" stroke-width="1.8" />
  <!-- Amravati to Sambhajinagar -->
  <line x1="575" y1="185" x2="415" y2="245" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- District Telemetry Nodes -->
  
  <!-- 1. MUMBAI (Financial & Digital Hub) -->
  <g transform="translate(205, 285)">
    <circle r="22" fill="url(#hubGlow)" />
    <circle r="12" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1" fill="none" stroke-dasharray="2 2" />
    <circle r="5" fill="#06B6D4" filter="url(#glowFilter)" />
    <circle r="2.5" fill="#FFFFFF" />
    <text x="14" y="-8" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="800">MUMBAI</text>
    <text x="14" y="5" fill="#06B6D4" font-family="monospace" font-size="9" font-weight="700">92.4% PLACEMENT</text>
  </g>

  <!-- 2. PUNE (Auto & IT Research Epicenter) -->
  <g transform="translate(280, 340)">
    <circle r="26" fill="url(#goldGlow)" />
    <circle r="15" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="1.2" fill="none" stroke-dasharray="3 3" />
    <circle r="6" fill="#F59E0B" filter="url(#glowFilter)" />
    <circle r="3" fill="#FFFFFF" />
    <text x="16" y="-10" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12" font-weight="900">PUNE METRO</text>
    <text x="16" y="4" fill="#F59E0B" font-family="monospace" font-size="9.5" font-weight="700">HIGH RETENTION · 89.1%</text>
    <text x="16" y="16" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5">Auto &amp; Cloud Clusters</text>
  </g>

  <!-- 3. NAGPUR (Logistics & Central Tech Hub) -->
  <g transform="translate(690, 175)">
    <circle r="20" fill="url(#hubGlow)" />
    <circle r="11" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1" fill="none" stroke-dasharray="2 2" />
    <circle r="5" fill="#06B6D4" filter="url(#glowFilter)" />
    <circle r="2" fill="#FFFFFF" />
    <text x="12" y="-6" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="800">NAGPUR</text>
    <text x="12" y="7" fill="#06B6D4" font-family="monospace" font-size="9" font-weight="700">MIHAN SEZ · 84.8%</text>
  </g>

  <!-- 4. NASHIK (Engineering & Manufacturing Hub) -->
  <g transform="translate(265, 205)">
    <circle r="14" fill="url(#goldGlow)" />
    <circle r="4" fill="#F59E0B" />
    <circle r="1.5" fill="#FFFFFF" />
    <text x="-70" y="-8" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">NASHIK</text>
    <text x="-70" y="4" fill="#94A3B8" font-family="monospace" font-size="8.5">79.5% OUTCOME</text>
  </g>

  <!-- 5. CHHATRAPATI SAMBHAJINAGAR (Industrial Growth Node) -->
  <g transform="translate(415, 245)">
    <circle r="15" fill="url(#hubGlow)" />
    <circle r="4.5" fill="#06B6D4" />
    <circle r="2" fill="#FFFFFF" />
    <text x="10" y="-6" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">SAMBHAJINAGAR</text>
    <text x="10" y="6" fill="#06B6D4" font-family="monospace" font-size="8.5">DMIC AURIC NODE</text>
  </g>

  <!-- 6. KOLHAPUR (Precision Casting & Engineering) -->
  <g transform="translate(270, 465)">
    <circle r="14" fill="url(#goldGlow)" />
    <circle r="4" fill="#F59E0B" />
    <circle r="1.5" fill="#FFFFFF" />
    <text x="12" y="2" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10" font-weight="700">KOLHAPUR</text>
    <text x="12" y="13" fill="#94A3B8" font-family="monospace" font-size="8">76.2% SKILLED</text>
  </g>

  <!-- 7. SOLAPUR (Textile & Renewable) -->
  <g transform="translate(395, 400)">
    <circle r="12" fill="url(#hubGlow)" />
    <circle r="3.5" fill="#06B6D4" />
    <text x="10" y="2" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">SOLAPUR</text>
  </g>

  <!-- 8. AMRAVATI (Textile & Agro-Processing) -->
  <g transform="translate(575, 185)">
    <circle r="12" fill="url(#goldGlow)" />
    <circle r="3.5" fill="#F59E0B" />
    <text x="10" y="2" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">AMRAVATI</text>
  </g>

  <!-- Telemetry Signal Verification Badges Floating -->
  <g transform="translate(620, 420)">
    <rect width="210" height="68" rx="8" fill="#0B132B" fill-opacity="0.85" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="20" cy="24" r="5" fill="#10B981" />
    <text x="32" y="27" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="11" font-weight="800">STATE WORKFORCE KPI</text>
    <text x="20" y="44" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9.5">Verified Placements: 84.6%</text>
    <text x="20" y="58" fill="#06B6D4" font-family="monospace" font-size="9">365-Day Retention: +18.4% YoY</text>
  </g>

  <g transform="translate(90, 390)">
    <rect width="170" height="54" rx="8" fill="#0B132B" fill-opacity="0.85" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1" />
    <circle cx="18" cy="20" r="4" fill="#06B6D4" />
    <text x="28" y="23" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800">NSQF LEDGER FEED</text>
    <text x="18" y="41" fill="#10B981" font-family="monospace" font-size="9">LIVE: 148,290 PASSES</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="barGold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <ellipse cx="160" cy="150" rx="120" ry="16" fill="#0B132B" fill-opacity="0.5"/>

  <!-- Analytics Chart Board -->
  <g transform="translate(160, 78)">
    <rect x="-56" y="-45" width="112" height="90" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Coordinate Grid inside Board -->
    <line x1="-42" y1="-25" x2="42" y2="-25" stroke="#1E293B" stroke-width="0.8"/>
    <line x1="-42" y1="-5" x2="42" y2="-5" stroke="#1E293B" stroke-width="0.8"/>
    <line x1="-42" y1="15" x2="42" y2="15" stroke="#1E293B" stroke-width="0.8"/>
    <line x1="-42" y1="28" x2="42" y2="28" stroke="#334155" stroke-width="1"/>

    <!-- Ghost Data Bars -->
    <rect x="-36" y="8" width="12" height="20" rx="2" fill="url(#barGrad)" opacity="0.4"/>
    <rect x="-18" y="-12" width="12" height="40" rx="2" fill="url(#barGold)" opacity="0.6"/>
    <rect x="0" y="-2" width="12" height="30" rx="2" fill="url(#barGrad)" opacity="0.4"/>
    <rect x="18" y="14" width="12" height="14" rx="2" fill="#334155" opacity="0.5"/>

    <!-- Trend Line -->
    <path d="M -30 6 L -12 -14 L 6 -4 L 24 12" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 2"/>
    <circle cx="-12" cy="-14" r="3" fill="#F8FAFC"/>
  </g>

  <g transform="translate(160, 156)">
    <text x="0" y="2" fill="#94A3B8" font-family="monospace" font-size="8.5" font-weight="600" text-anchor="middle">
      DISTRICT PIPELINE: NO AGGREGATED REPORTS AVAILABLE
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none" width="100%" height="100%">
  <defs>
    <radialGradient id="shieldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Ground Plane -->
  <ellipse cx="160" cy="148" rx="110" ry="16" fill="#0B132B" fill-opacity="0.5"/>

  <!-- Background Ledger Certificate Sheet -->
  <g transform="translate(160, 78)">
    <rect x="-42" y="-48" width="84" height="96" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <!-- Document Lines -->
    <line x1="-28" y1="-32" x2="10" y2="-32" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="-28" y1="-22" x2="28" y2="-22" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-28" y1="-14" x2="20" y2="-14" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-28" y1="-6" x2="26" y2="-6" stroke="#475569" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Central Security Shield -->
    <circle cx="0" cy="18" r="28" fill="url(#shieldGlow)"/>
    <path d="M 0 4 L 16 11 L 16 26 C 16 35, 0 41, 0 41 C 0 41, -16 35, -16 26 L -16 11 Z" 
          fill="#0B0F17" stroke="url(#shieldBorder)" stroke-width="1.8"/>
    
    <!-- Lock / Check inside shield -->
    <path d="M -4 20 L -1 23 L 5 17" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- SHA-256 Watermark Pill -->
  <g transform="translate(160, 154)">
    <rect x="-65" y="-9" width="130" height="18" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
    <text x="0" y="3" fill="#94A3B8" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">
      LEDGER: ZERO PENDING QUEUES
    </text>
  </g>
</svg>

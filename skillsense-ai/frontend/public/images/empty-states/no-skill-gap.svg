<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="gapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base Platform -->
  <ellipse cx="160" cy="148" rx="130" ry="16" fill="#0B132B" fill-opacity="0.6"/>
  <ellipse cx="160" cy="148" rx="100" ry="10" stroke="#334155" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Skills to Insight Trajectory Arc -->
  <path d="M 55 110 C 95 110, 115 70, 160 70 C 205 70, 225 110, 265 110" 
        stroke="url(#gapGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 3"/>

  <!-- Node 1: Raw Skill Assessment (Left) -->
  <g transform="translate(55, 110)">
    <circle r="18" fill="url(#cyanGlow)"/>
    <circle r="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <!-- Layers / Stack Icon -->
    <path d="M -5 -2 L 0 -5 L 5 -2 L 0 1 Z" fill="#38BDF8"/>
    <path d="M -5 1 L 0 4 L 5 1" stroke="#38BDF8" stroke-width="1" fill="none"/>
    <path d="M -5 4 L 0 7 L 5 4" stroke="#38BDF8" stroke-width="1" fill="none"/>
    <text x="0" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">SKILLS</text>
  </g>

  <!-- Node 2: Multi-Axis Radar Analytics (Center) -->
  <g transform="translate(160, 70)">
    <circle r="22" fill="url(#goldGlow)"/>
    <circle r="16" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <!-- Radar Pentagon -->
    <polygon points="0,-8 7,-3 5,6 -5,6 -7,-3" stroke="#F59E0B" stroke-width="1.2" fill="none"/>
    <polygon points="0,-4 3,-1 2,3 -2,3 -3,-1" fill="#F59E0B" fill-opacity="0.4"/>
    <text x="0" y="-22" fill="#F59E0B" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">NSQF BENCHMARK</text>
    <text x="0" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">ANALYTICS</text>
  </g>

  <!-- Node 3: Strategic Roadmap & Career Insight (Right) -->
  <g transform="translate(265, 110)">
    <circle r="20" fill="url(#goldGlow)"/>
    <circle r="13" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <!-- Target / Bullseye -->
    <circle cx="0" cy="0" r="6" stroke="#10B981" stroke-width="1.2" fill="none"/>
    <circle cx="0" cy="0" r="2" fill="#10B981"/>
    <text x="0" y="24" fill="#10B981" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">INSIGHT</text>
  </g>

  <!-- Floating Telemetry Badge -->
  <g transform="translate(160, 142)">
    <rect x="-42" y="-10" width="84" height="18" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.75"/>
    <circle cx="-30" cy="-1" r="2.5" fill="#F59E0B"/>
    <text x="-24" y="2.5" fill="#E2E8F0" font-family="monospace" font-size="8" font-weight="700">GAP ROADMAP</text>
  </g>
</svg>

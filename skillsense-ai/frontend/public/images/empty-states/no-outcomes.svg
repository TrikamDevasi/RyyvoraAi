<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base Platform -->
  <ellipse cx="160" cy="148" rx="130" ry="16" fill="#0B132B" fill-opacity="0.6"/>
  <ellipse cx="160" cy="148" rx="100" ry="10" stroke="#334155" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Career Pathway S-Curve Line -->
  <path d="M 50 120 C 90 120, 110 75, 160 75 C 210 75, 230 115, 270 115" 
        stroke="url(#pathGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 3"/>

  <!-- Step 1: Candidate Enrollment Node (Left) -->
  <g transform="translate(50, 120)">
    <circle r="18" fill="url(#nodeGlow)"/>
    <circle r="12" fill="#0F172A" stroke="#64748B" stroke-width="1.5"/>
    <!-- Student Icon -->
    <path d="M -6 -1 L 0 -4 L 6 -1 L 0 2 Z" fill="#94A3B8"/>
    <path d="M -4 1 L -4 4 C -4 5, 4 5, 4 4 L 4 1" stroke="#94A3B8" stroke-width="1" fill="none"/>
    <text x="0" y="24" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">CANDIDATE</text>
  </g>

  <!-- Step 2: Skill Acquisition & Evaluation Node (Center) -->
  <g transform="translate(160, 75)">
    <circle r="22" fill="url(#nodeGlow)"/>
    <circle r="15" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <!-- Diagnostic Pulse / Gear -->
    <circle cx="0" cy="0" r="6" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>
    <circle cx="0" cy="0" r="2.5" fill="#F59E0B"/>
    <text x="0" y="-22" fill="#F59E0B" font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">NSQF ASSESSMENT</text>
    <text x="0" y="26" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">SKILL MAPPING</text>
  </g>

  <!-- Step 3: Verified Employment Outcome Node (Right) -->
  <g transform="translate(270, 115)">
    <circle r="20" fill="url(#greenGlow)"/>
    <circle r="14" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <!-- Briefcase / Verified Check -->
    <path d="M -4 -2 L -4 4 L 4 4 L 4 -2 Z" stroke="#10B981" stroke-width="1.2" fill="none"/>
    <path d="M -2 -2 L -2 -4 L 2 -4 L 2 -2" stroke="#10B981" stroke-width="1" fill="none"/>
    <text x="0" y="24" fill="#10B981" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">EMPLOYED</text>
  </g>

  <!-- Floating Telemetry Indicator -->
  <g transform="translate(135, 142)">
    <rect x="-35" y="-10" width="70" height="18" rx="4" fill="#1E293B" stroke="#334155" stroke-width="0.75"/>
    <text x="0" y="2" fill="#94A3B8" font-family="monospace" font-size="7.5" font-weight="600" text-anchor="middle">AWAITING DATA</text>
  </g>
</svg>

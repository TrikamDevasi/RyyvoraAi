<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" width="100%" height="100%" opacity="0.08">
  <defs>
    <linearGradient id="guillocheStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <g transform="translate(250, 250)" stroke="url(#guillocheStroke)" stroke-width="0.75" fill="none">
    <!-- Concentric Rosette Petals -->
    <ellipse cx="0" cy="0" rx="220" ry="80" transform="rotate(0)" />
    <ellipse cx="0" cy="0" rx="220" ry="80" transform="rotate(15)" />
    <ellipse cx="0" cy="0" rx="220" ry="80" transform="rotate(30)" />
    <ellipse cx="0" cy="0" rx="220" ry="80" transform="rotate(45)" />
    <ellipse cx="0" cy="0" rx="220" ry="80" transform="rotate(60)" />
    <ellipse cx="0" cy="0" rx="220" ry="80" transform="rotate(75)" />
    <ellipse cx="0" cy="0" rx="220" ry="80" transform="rotate(90)" />
    <ellipse cx="0" cy="0" rx="220" ry="80" transform="rotate(105)" />
    <ellipse cx="0" cy="0" rx="220" ry="80" transform="rotate(120)" />
    <ellipse cx="0" cy="0" rx="220" ry="80" transform="rotate(135)" />
    <ellipse cx="0" cy="0" rx="220" ry="80" transform="rotate(150)" />
    <ellipse cx="0" cy="0" rx="220" ry="80" transform="rotate(165)" />

    <!-- Inner Dense Rosette -->
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(7.5)" stroke-width="0.5" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(22.5)" stroke-width="0.5" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(37.5)" stroke-width="0.5" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(52.5)" stroke-width="0.5" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(67.5)" stroke-width="0.5" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(82.5)" stroke-width="0.5" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(97.5)" stroke-width="0.5" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(112.5)" stroke-width="0.5" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(127.5)" stroke-width="0.5" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(142.5)" stroke-width="0.5" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(157.5)" stroke-width="0.5" />
    <ellipse cx="0" cy="0" rx="140" ry="50" transform="rotate(172.5)" stroke-width="0.5" />

    <circle cx="0" cy="0" r="160" stroke-dasharray="2 3" stroke-width="0.5" />
    <circle cx="0" cy="0" r="100" stroke-dasharray="4 2" stroke-width="0.75" />
    <circle cx="0" cy="0" r="40" stroke-width="1" />
  </g>
</svg>
